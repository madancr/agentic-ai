  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#334155"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0f8a63"/></marker>
  <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker>

<text x="40" y="48" class="t">URL Shortener with an LLM Agent in front of the REST API</text>
<text x="40" y="76" class="st">The model only ASKS for tools. Java code checks, approves, executes and audits every call. The service underneath is unchanged.</text>

<!-- USER -->
<rect x="40" y="165" width="200" height="120" rx="12" class="box"/>
<text x="58" y="195" class="h">User</text>
<text x="58" y="219" class="s">"Shorten this as spring-</text>
<text x="58" y="237" class="s">launch for 7 days, then</text>
<text x="58" y="255" class="s">show its analytics"</text>
<text x="58" y="275" class="m">AgentChat / AgentDemo</text>

<!-- FLOW STEPS -->
<rect x="40" y="320" width="200" height="500" rx="12" class="box"/>
<text x="58" y="350" class="h">Request flow</text>
<g class="s">
  <circle cx="68" cy="384" r="11" class="num"/><text x="64" y="389" class="numt">1</text><text x="88" y="381">User sends a</text><text x="88" y="397">request</text>
  <circle cx="68" cy="440" r="11" class="num"/><text x="64" y="445" class="numt">2</text><text x="88" y="437">LLM plans: replies</text><text x="88" y="453">with tool_use</text>
  <circle cx="68" cy="496" r="11" class="num"/><text x="64" y="501" class="numt">3</text><text x="88" y="493">Guardrails check</text><text x="88" y="509">the call</text>
  <circle cx="68" cy="552" r="11" class="num"/><text x="64" y="557" class="numt">4</text><text x="88" y="549">Human approves</text><text x="88" y="565">(custom alias only)</text>
  <circle cx="68" cy="608" r="11" class="num"/><text x="64" y="613" class="numt">5</text><text x="88" y="605">Tool calls the</text><text x="88" y="621">REST API over HTTP</text>
  <circle cx="68" cy="664" r="11" class="num"/><text x="64" y="669" class="numt">6</text><text x="88" y="661">Result goes back to</text><text x="88" y="677">the LLM; repeat</text>
  <circle cx="68" cy="720" r="11" class="num"/><text x="64" y="725" class="numt">7</text><text x="88" y="717">LLM answers the</text><text x="88" y="733">user in plain text</text>
</g>
<text x="58" y="776" class="m">Every step is written to</text>
<text x="58" y="794" class="m">the audit log.</text>

<!-- AGENT LAYER -->
<rect x="280" y="115" width="640" height="705" rx="14" class="band-a"/>
<text x="300" y="142" class="lab" fill="#1d4ed8">LLM AGENT LAYER · com.madan.urlshortener.agent (new)</text>

<rect x="305" y="160" width="590" height="120" rx="10" class="boxa"/>
<text x="325" y="190" class="h">Agent (the loop)</text>
<text x="325" y="214" class="s">Keeps the conversation, sends it to the LLM with the tool definitions,</text>
<text x="325" y="232" class="s">runs each requested tool call, feeds results back until the LLM answers.</text>
<text x="325" y="258" class="m">Safety limits: max 5 LLM iterations and 6 tool calls per request, then a safe stop.</text>

<rect x="305" y="305" width="590" height="125" rx="10" class="boxa"/>
<text x="325" y="335" class="h">Guardrails (checked before EVERY tool call)</text>
<rect x="325" y="352" width="130" height="58" rx="8" class="chipr"/><text x="337" y="376" class="s">Tool allow-list</text><text x="337" y="396" class="m">no invented tools</text>
<rect x="467" y="352" width="130" height="58" rx="8" class="chipr"/><text x="479" y="376" class="s">Schema check</text><text x="479" y="396" class="m">types, ranges</text>
<rect x="609" y="352" width="130" height="58" rx="8" class="chipr"/><text x="621" y="376" class="s">Destination</text><text x="621" y="396" class="m">no internal hosts</text>
<rect x="751" y="352" width="126" height="58" rx="8" class="chipr"/><text x="763" y="376" class="s">Call budget</text><text x="763" y="396" class="m">stops loops</text>

<rect x="305" y="455" width="280" height="100" rx="10" class="boxa"/>
<text x="325" y="485" class="h">Human approval</text>
<text x="325" y="509" class="s">Custom alias = public name</text>
<text x="325" y="527" class="s">→ reviewer answers y / n</text>

<rect x="615" y="455" width="280" height="100" rx="10" class="boxa"/>
<text x="635" y="485" class="h">Audit log + metrics</text>
<text x="635" y="509" class="s">Hash-chained (tamper-evident)</text>
<text x="635" y="527" class="s">Stores the server's X-Request-Id</text>

<rect x="305" y="580" width="590" height="220" rx="10" class="boxa"/>
<text x="325" y="610" class="h">Tools (what the LLM is allowed to call)</text>
<rect x="325" y="625" width="550" height="36" rx="7" class="chip"/><text x="340" y="648" class="code">shorten_url(url, alias?, ttl_seconds?)   →  POST /api/shorten</text>
<rect x="325" y="669" width="550" height="36" rx="7" class="chip"/><text x="340" y="692" class="code">get_link_stats(code)                     →  GET /api/stats/{code}</text>
<rect x="325" y="713" width="550" height="36" rx="7" class="chip"/><text x="340" y="736" class="code">get_link_analytics(code)                 →  GET /api/analytics/{code}</text>
<text x="325" y="775" class="m">ShortenerApiClient (java.net.http): on HTTP 429 waits for Retry-After, retries once.</text>
<text x="325" y="792" class="m">Stats and analytics are read-only, so the agent never inflates click counts.</text>

<!-- LLM -->
<rect x="965" y="115" width="595" height="150" rx="12" class="boxl"/>
<text x="985" y="145" class="h">LLM (the "brain" that plans)</text>
<text x="985" y="171" class="s">ClaudeLlmClient → Claude Messages API with tool use (real model)</text>
<text x="985" y="193" class="s">OfflineLlmClient → rule-based stand-in for the demo (no API key)</text>
<text x="985" y="215" class="s">ScriptedLlmClient → a deliberately misbehaving model for tests</text>
<text x="985" y="245" class="m">All three implement one LlmClient interface, so the loop cannot tell them apart.</text>
<path class="arrl" d="M895,190 L963,190" marker-end="url(#p)"/>
<path class="arrl" d="M963,240 L897,240" marker-end="url(#p)"/>
<text x="900" y="182" class="al" fill="#6d28d9">2 ask</text>
<text x="899" y="262" class="al" fill="#6d28d9">tool_use</text>

<!-- SERVICE -->
<rect x="965" y="300" width="595" height="520" rx="14" class="band-s"/>
<text x="985" y="327" class="lab" fill="#0f766e">EXISTING URL SHORTENER (unchanged) · com.madan.urlshortener</text>

<rect x="990" y="345" width="545" height="62" rx="9" class="boxs"/>
<text x="1008" y="372" class="h">RequestLoggingFilter</text>
<text x="1008" y="394" class="s">JSON access log per request + X-Request-Id header</text>

<rect x="990" y="432" width="130" height="118" rx="9" class="boxs"/>
<text x="1002" y="458" class="h" style="font-size:14px">Shorten</text><text x="1002" y="476" class="h" style="font-size:14px">Handler</text>
<text x="1002" y="500" class="m">+ RateLimiter</text><text x="1002" y="517" class="m">20 burst, 10/s</text><text x="1002" y="534" class="m">429 + Retry-After</text>
<rect x="1128" y="432" width="130" height="118" rx="9" class="boxs"/>
<text x="1140" y="458" class="h" style="font-size:14px">Stats</text><text x="1140" y="476" class="h" style="font-size:14px">Handler</text>
<text x="1140" y="500" class="m">link + clicks</text><text x="1140" y="517" class="m">no click counted</text>
<rect x="1266" y="432" width="130" height="118" rx="9" class="boxs"/>
<text x="1278" y="458" class="h" style="font-size:14px">Analytics</text><text x="1278" y="476" class="h" style="font-size:14px">Handler</text>
<text x="1278" y="500" class="m">24h / 7d,</text><text x="1278" y="517" class="m">top referrers</text>
<rect x="1404" y="432" width="131" height="118" rx="9" class="boxs"/>
<text x="1416" y="458" class="h" style="font-size:14px">Redirect</text><text x="1416" y="476" class="h" style="font-size:14px">Handler</text>
<text x="1416" y="500" class="m">GET /{code}</text><text x="1416" y="517" class="m">browsers, 302,</text><text x="1416" y="534" class="m">counts clicks</text>

<rect x="990" y="585" width="545" height="80" rx="9" class="boxs"/>
<text x="1008" y="613" class="h">UrlShortenerService</text>
<text x="1008" y="636" class="s">URL/alias validation · counter + Base62 codes · dedupe · expiry</text>
<text x="1008" y="654" class="s">click recording · analytics aggregation</text>

<rect x="990" y="700" width="545" height="90" rx="9" class="boxs"/>
<text x="1008" y="728" class="h">UrlRepository</text>
<text x="1008" y="751" class="s">In-memory ConcurrentHashMap (code → entry, longUrl → code)</text>
<text x="1008" y="771" class="m">Swappable for SQL / Redis / DynamoDB without touching the service</text>

<text x="912" y="700" class="al" fill="#0f766e" transform="rotate(-90 912 700)">5 HTTP call  ·  6 JSON back</text>

<!-- footer -->
<text x="40" y="858" class="m">Key design choice: the agent is just another HTTP client. It gets the same validation, rate limiting and access logging as curl or a browser, and it cannot bypass business rules.</text>
<text x="40" y="880" class="m">Everything is plain Java 21+ (JDK only: com.sun.net.httpserver, java.net.http), no frameworks or libraries.</text>
